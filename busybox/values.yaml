# Default values for busybox.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#
# testingNamespace is a fixed, separate namespace this chart always creates
# (e.g. for cluster sanity checks). It is NOT where the deployment/service
# run - those always deploy into the release namespace (.Release.Namespace),
# which Rafay sets to whatever namespace is selected when the addon is
# deployed. This lets the addon create "testing" while still landing the
# workload wherever Rafay points it.
testingNamespace: testing
createNamespace: true
replicaCount: 1
tolerations:
  - operator: "Exists"
image:
  repository: busybox
  tag: latest
  pullPolicy: IfNotPresent
service:
  name: busybox
  type: ClusterIP
  externalPort: 80
  internalPort: 8080
resources:
  limits:
    cpu: 100m
    memory: 100Mi
  requests:
    cpu: 100m
    memory: 100Mi
